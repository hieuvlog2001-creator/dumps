name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            echo "================================"
            echo "SSH CONNECTION"
            echo "================================"

            whoami
            id
            hostname

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "================================"
            echo "PREPARING DIRECTORY"
            echo "================================"

            # Tạo thư mục bằng root
            sudo mkdir -p "$APP_DIR"

            # Xóa toàn bộ nội dung cũ
            sudo find "$APP_DIR" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

            # Cho user hiện tại sở hữu thư mục
            sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"

            sudo chmod 755 "$APP_DIR"

            echo "Directory:"
            ls -ld "$APP_DIR"

            echo "================================"
            echo "DIRECTORY READY"
            echo "================================"


      # ========================================
      # 3. COPY FILES
      # ========================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          # QUAN TRỌNG:
          # Không cho SCP xóa target folder
          rm: false

          timeout: 60s


      # ========================================
      # 4. BUILD + RUN
      # ========================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}
          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"

            echo "================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "================================"

            pwd
            ls -la

            echo "================================"
            echo "CHECKING FILES"
            echo "================================"

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            if [ -f "docker-compose.yml" ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f "docker-compose.yaml" ]; then
              COMPOSE_FILE="docker-compose.yaml"
            else
              echo "ERROR: docker-compose.yml not found"
              exit 1
            fi

            echo "Using: $COMPOSE_FILE"

            echo "================================"
            echo "NODE"
            echo "================================"

            node --version || true
            npm --version || true

            echo "================================"
            echo "DOCKER"
            echo "================================"

            docker --version
            docker compose version

            echo "================================"
            echo "STOP OLD CONTAINERS"
            echo "================================"

            docker compose down --remove-orphans || true

            echo "================================"
            echo "BUILD"
            echo "================================"

            docker compose build --no-cache

            echo "================================"
            echo "START"
            echo "================================"

            docker compose up -d

            echo "================================"
            echo "STATUS"
            echo "================================"

            docker compose ps

            echo "================================"
            echo "DOCKER PS"
            echo "================================"

            docker ps

            echo "================================"
            echo "DEPLOYMENT COMPLETED"
            echo "================================"
