name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "========================================"
            echo "SSH CONNECTION SUCCESS"
            echo "========================================"

            echo "User:"
            whoami

            echo "UID:"
            id

            echo "Hostname:"
            hostname


            # ========================================
            # CHECK APP DIRECTORY
            # ========================================

            echo "========================================"
            echo "CHECKING APPLICATION DIRECTORY"
            echo "========================================"

            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR"
              mkdir -p "$APP_DIR"
            fi

            echo "Application directory:"
            ls -ld "$APP_DIR"


            # ========================================
            # CHECK DOCKER
            # ========================================

            echo "========================================"
            echo "CHECKING DOCKER"
            echo "========================================"

            docker --version
            docker compose version

            echo "Docker access:"
            docker ps


            # ========================================
            # STOP OLD CONTAINER
            # ========================================

            echo "========================================"
            echo "STOPPING OLD CONTAINER"
            echo "========================================"

            cd "$APP_DIR"

            if [ -f "docker-compose.yml" ]; then

              echo "Found docker-compose.yml"

              docker compose -f docker-compose.yml down \
                --remove-orphans || true

            elif [ -f "docker-compose.yaml" ]; then

              echo "Found docker-compose.yaml"

              docker compose -f docker-compose.yaml down \
                --remove-orphans || true

            else

              echo "No existing compose file."

            fi


            # ========================================
            # FIX PERMISSIONS
            # ========================================

            echo "========================================"
            echo "FIXING APPLICATION PERMISSIONS"
            echo "========================================"

            CONTAINER_UID=$(id -u)
            CONTAINER_GID=$(id -g)

            echo "Host UID: $CONTAINER_UID"
            echo "Host GID: $CONTAINER_GID"

            # Use Docker itself to fix ownership.
            # This avoids requiring sudo password.
            docker run --rm \
              -v "$APP_DIR:/app" \
              busybox:latest \
              sh -c "chown -R ${CONTAINER_UID}:${CONTAINER_GID} /app || true"

            echo "Permissions fixed."


            # ========================================
            # CLEAN OLD APPLICATION FILES
            # ========================================
            #
            # IMPORTANT:
            # uploads and logs are preserved.
            #
            # This prevents:
            # - uploaded files being deleted
            # - generated results being deleted
            # - server logs being deleted
            # - permission problems
            #

            echo "========================================"
            echo "CLEANING OLD APPLICATION FILES"
            echo "========================================"

            find "$APP_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name "uploads" \
              ! -name "logs" \
              ! -name ".env" \
              -exec rm -rf {} +

            echo "Old application files removed."


            # ========================================
            # CREATE REQUIRED DIRECTORIES
            # ========================================

            echo "========================================"
            echo "CREATING REQUIRED DIRECTORIES"
            echo "========================================"

            mkdir -p "$APP_DIR/uploads"
            mkdir -p "$APP_DIR/logs"

            echo "Directories ready."

            ls -la "$APP_DIR"


      # ========================================
      # 3. COPY PROJECT
      # ========================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          timeout: 60s
          command_timeout: 10m

          overwrite: true
          rm: false


      # ========================================
      # 4. BUILD + RUN
      # ========================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"


            # ========================================
            # BASIC INFORMATION
            # ========================================

            echo "========================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "========================================"

            pwd
            ls -la


            # ========================================
            # REQUIRED FILES
            # ========================================

            echo "========================================"
            echo "CHECKING REQUIRED FILES"
            echo "========================================"

            if [ ! -f "package.json" ]; then

              echo "ERROR: package.json not found"

              echo "Files:"
              ls -la

              exit 1

            fi

            if [ ! -f "Dockerfile" ]; then

              echo "ERROR: Dockerfile not found"

              ls -la

              exit 1

            fi


            # ========================================
            # FIND COMPOSE FILE
            # ========================================

            echo "========================================"
            echo "CHECKING DOCKER COMPOSE"
            echo "========================================"

            if [ -f "docker-compose.yml" ]; then

              COMPOSE_FILE="docker-compose.yml"

            elif [ -f "docker-compose.yaml" ]; then

              COMPOSE_FILE="docker-compose.yaml"

            else

              echo "ERROR: docker-compose.yml not found"

              ls -la

              exit 1

            fi

            echo "Using:"
            echo "$COMPOSE_FILE"


            # ========================================
            # DOCKER INFORMATION
            # ========================================

            echo "========================================"
            echo "DOCKER VERSION"
            echo "========================================"

            docker --version
            docker compose version


            # ========================================
            # DOCKER ACCESS
            # ========================================

            echo "========================================"
            echo "DOCKER ACCESS"
            echo "========================================"

            docker ps


            # ========================================
            # BUILD
            # ========================================

            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              build --no-cache


            # ========================================
            # START
            # ========================================

            echo "========================================"
            echo "STARTING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              up -d


            # ========================================
            # WAIT
            # ========================================

            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            sleep 10


            # ========================================
            # CONTAINER STATUS
            # ========================================

            echo "========================================"
            echo "CONTAINER STATUS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              ps


            # ========================================
            # DOCKER PS
            # ========================================

            echo "========================================"
            echo "DOCKER PS"
            echo "========================================"

            docker ps


            # ========================================
            # PORT 5555
            # ========================================

            echo "========================================"
            echo "PORT 5555"
            echo "========================================"

            ss -lntp | grep 5555 || true


            # ========================================
            # LOCAL HEALTH CHECK
            # ========================================

            echo "========================================"
            echo "LOCAL HEALTH CHECK"
            echo "========================================"

            if curl -fsS \
              --max-time 15 \
              http://127.0.0.1:5555/api/health
            then

              echo ""
              echo "HEALTH CHECK: OK"

            else

              echo ""
              echo "HEALTH CHECK: FAILED"

              echo "Checking container logs..."

              docker compose \
                -f "$COMPOSE_FILE" \
                logs --tail=100

              exit 1

            fi


            # ========================================
            # CONTAINER HEALTH
            # ========================================

            echo "========================================"
            echo "CONTAINER HEALTH"
            echo "========================================"

            CONTAINER_ID=$(docker compose \
              -f "$COMPOSE_FILE" \
              ps -q il2cpp-dumper 2>/dev/null || true)

            if [ -n "$CONTAINER_ID" ]; then

              echo "Container ID:"
              echo "$CONTAINER_ID"

              echo "Container status:"

              docker inspect \
                --format='{{.State.Status}}' \
                "$CONTAINER_ID" || true

              echo "Health status:"

              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID" || true

            fi


            # ========================================
            # APPLICATION LOGS
            # ========================================

            echo "========================================"
            echo "APPLICATION LOGS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              logs --tail=50 || true


            # ========================================
            # FINAL TEST
            # ========================================

            echo "========================================"
            echo "FINAL PORT TEST"
            echo "========================================"

            curl \
              --max-time 15 \
              -I \
              http://127.0.0.1:5555/ || true


            # ========================================
            # DEPLOYMENT SUCCESS
            # ========================================

            echo ""
            echo "========================================"
            echo "DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "========================================"

            echo "Application:"
            echo "http://127.0.0.1:5555"

            echo "Port:"
            echo "5555"

            echo "========================================"
