name: Deploy to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. PREPARE VPS
      # ============================================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 60s
          command_timeout: 10m

          script_stop: true

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "========================================"
            echo "SSH CONNECTION SUCCESS"
            echo "========================================"

            echo "User:"
            whoami

            echo ""
            echo "UID:"
            id

            echo ""
            echo "Hostname:"
            hostname

            echo ""
            echo "========================================"
            echo "CHECKING DOCKER"
            echo "========================================"

            docker --version
            docker compose version

            echo ""
            echo "========================================"
            echo "CHECKING DOCKER PERMISSION"
            echo "========================================"

            docker ps

            echo ""
            echo "========================================"
            echo "PREPARING APPLICATION DIRECTORY"
            echo "========================================"

            # Thư mục đã tồn tại trên VPS.
            # Không dùng sudo vì GitHub Actions SSH không có TTY.
            if [ ! -d "$APP_DIR" ]; then
                echo "ERROR: $APP_DIR does not exist."
                echo ""
                echo "Run this once manually on VPS:"
                echo "mkdir -p $APP_DIR"
                exit 1
            fi

            echo "Application directory:"
            ls -ld "$APP_DIR"

            echo ""
            echo "Current owner:"
            stat -c '%U:%G' "$APP_DIR"

            echo ""
            echo "========================================"
            echo "CHECKING EXISTING CONTAINER"
            echo "========================================"

            cd "$APP_DIR"

            if [ -f "docker-compose.yml" ]; then

                echo "Found docker-compose.yml"

                docker compose -f docker-compose.yml down \
                  --remove-orphans || true

            elif [ -f "docker-compose.yaml" ]; then

                echo "Found docker-compose.yaml"

                docker compose -f docker-compose.yaml down \
                  --remove-orphans || true

            else

                echo "No existing compose file."
                echo "Nothing to stop."

            fi

            echo ""
            echo "========================================"
            echo "REMOVING OLD DEPLOYMENT FILES"
            echo "========================================"

            # Xóa source cũ.
            #
            # uploads và data cũng sẽ bị xóa nếu nằm trong thư mục này.
            # Nếu muốn giữ dữ liệu upload, xem phần ghi chú bên dưới.
            find "$APP_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -exec rm -rf {} +

            echo "Old deployment removed."

            echo ""
            echo "========================================"
            echo "DIRECTORY READY"
            echo "========================================"

            ls -la "$APP_DIR"


      # ============================================================
      # 3. COPY PROJECT TO VPS
      # ============================================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          timeout: 120s
          command_timeout: 15m

          overwrite: true

          rm: false


      # ============================================================
      # 4. BUILD + RUN
      # ============================================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 60s
          command_timeout: 30m

          script_stop: true

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"

            echo "========================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "========================================"

            pwd
            ls -la

            echo ""
            echo "========================================"
            echo "CHECKING REQUIRED FILES"
            echo "========================================"

            if [ ! -f "package.json" ]; then

                echo "ERROR: package.json not found."

                echo ""
                echo "Files:"
                find . -maxdepth 2 -type f | sort | head -100

                exit 1
            fi

            echo "package.json: OK"


            # ========================================================
            # FIND DOCKER COMPOSE
            # ========================================================

            echo ""
            echo "========================================"
            echo "FINDING DOCKER COMPOSE FILE"
            echo "========================================"

            if [ -f "docker-compose.yml" ]; then

                COMPOSE_FILE="docker-compose.yml"

            elif [ -f "docker-compose.yaml" ]; then

                COMPOSE_FILE="docker-compose.yaml"

            else

                echo "ERROR:"
                echo "docker-compose.yml / docker-compose.yaml not found."

                ls -la

                exit 1
            fi

            echo "Compose file:"
            echo "$COMPOSE_FILE"


            # ========================================================
            # DOCKER CHECK
            # ========================================================

            echo ""
            echo "========================================"
            echo "DOCKER VERSION"
            echo "========================================"

            docker --version
            docker compose version


            echo ""
            echo "========================================"
            echo "DOCKER ACCESS"
            echo "========================================"

            docker ps


            # ========================================================
            # REMOVE OLD CONTAINERS
            # ========================================================

            echo ""
            echo "========================================"
            echo "STOPPING OLD APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              down \
              --remove-orphans || true


            # ========================================================
            # BUILD
            # ========================================================

            echo ""
            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              build \
              --no-cache


            # ========================================================
            # START
            # ========================================================

            echo ""
            echo "========================================"
            echo "STARTING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              up -d


            # ========================================================
            # WAIT
            # ========================================================

            echo ""
            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            sleep 5


            # ========================================================
            # COMPOSE STATUS
            # ========================================================

            echo ""
            echo "========================================"
            echo "DOCKER COMPOSE STATUS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              ps


            # ========================================================
            # DOCKER STATUS
            # ========================================================

            echo ""
            echo "========================================"
            echo "DOCKER PS"
            echo "========================================"

            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"


            # ========================================================
            # PORT 5555
            # ========================================================

            echo ""
            echo "========================================"
            echo "CHECKING PORT 5555"
            echo "========================================"

            ss -lntp | grep ':5555' || true


            # ========================================================
            # GET CONTAINER ID
            # ========================================================

            echo ""
            echo "========================================"
            echo "CONTAINER HEALTH"
            echo "========================================"

            CONTAINER_ID=$(
              docker compose \
                -f "$COMPOSE_FILE" \
                ps -q
            )

            if [ -n "$CONTAINER_ID" ]; then

                echo "Container ID:"
                echo "$CONTAINER_ID"

                echo ""
                echo "Container state:"

                docker inspect \
                  --format='{{.State.Status}}' \
                  "$CONTAINER_ID" || true

                echo ""
                echo "Health status:"

                docker inspect \
                  --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                  "$CONTAINER_ID" || true

            else

                echo "ERROR: Container was not found."

                exit 1
            fi


            # ========================================================
            # LOCAL HTTP TEST
            # ========================================================

            echo ""
            echo "========================================"
            echo "LOCAL HTTP TEST"
            echo "========================================"

            if curl \
              -fsS \
              --max-time 15 \
              http://127.0.0.1:5555/ \
              > /tmp/il2cpp_http_test.html; then

                echo "HTTP 5555: OK"

                echo ""
                echo "Response size:"
                wc -c /tmp/il2cpp_http_test.html

            else

                echo "ERROR: HTTP service is not responding."

                echo ""
                echo "Container logs:"

                docker compose \
                  -f "$COMPOSE_FILE" \
                  logs \
                  --tail=100

                exit 1
            fi


            # ========================================================
            # APPLICATION LOGS
            # ========================================================

            echo ""
            echo "========================================"
            echo "APPLICATION LOGS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              logs \
              --tail=100


            # ========================================================
            # FINAL STATUS
            # ========================================================

            echo ""
            echo "========================================"
            echo "DEPLOYMENT SUCCESS"
            echo "========================================"

            echo "Application:"
            echo "http://127.0.0.1:5555"

            echo ""
            echo "Port:"
            echo "5555"

            echo ""
            echo "Container:"
            docker ps \
              --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

            echo ""
            echo "========================================"
            echo "DEPLOYMENT COMPLETED"
            echo "========================================"
