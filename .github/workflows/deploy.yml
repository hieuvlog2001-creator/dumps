name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "================================"
            echo "SSH CONNECTION SUCCESS"
            echo "================================"

            echo "User:"
            whoami

            echo "UID:"
            id

            echo "Hostname:"
            hostname

            echo "================================"
            echo "CHECKING DEPLOYMENT DIRECTORY"
            echo "================================"

            if [ ! -d "$APP_DIR" ]; then
              echo "ERROR: $APP_DIR does not exist."
              echo "Please create it once manually on VPS:"
              echo "mkdir -p $APP_DIR"
              exit 1
            fi

            echo "Directory:"
            ls -ld "$APP_DIR"

            echo "================================"
            echo "CHECKING DOCKER ACCESS"
            echo "================================"

            docker --version
            docker compose version

            echo "================================"
            echo "STOPPING OLD CONTAINER"
            echo "================================"

            cd "$APP_DIR"

            if [ -f "docker-compose.yml" ]; then

              echo "docker-compose.yml found"

              docker compose down --remove-orphans || true

            elif [ -f "docker-compose.yaml" ]; then

              echo "docker-compose.yaml found"

              docker compose down --remove-orphans || true

            else

              echo "No existing compose file."
              echo "Nothing to stop."

            fi

            echo "================================"
            echo "CLEANING OLD FILES"
            echo "================================"

            find "$APP_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              -exec rm -rf {} +

            echo "Old files removed."

            echo "================================"
            echo "DIRECTORY READY"
            echo "================================"

            ls -la "$APP_DIR"


      # ========================================
      # 3. COPY PROJECT
      # ========================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          timeout: 60s
          command_timeout: 10m

          rm: false
          overwrite: true


      # ========================================
      # 4. BUILD + RUN
      # ========================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"

            echo "================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "================================"

            pwd
            ls -la


            # ========================================
            # CHECK PACKAGE.JSON
            # ========================================

            echo "================================"
            echo "CHECKING REQUIRED FILES"
            echo "================================"

            if [ ! -f "package.json" ]; then

              echo "ERROR: package.json not found"

              echo "Files in directory:"
              ls -la

              exit 1

            fi


            # ========================================
            # FIND COMPOSE FILE
            # ========================================

            if [ -f "docker-compose.yml" ]; then

              COMPOSE_FILE="docker-compose.yml"

            elif [ -f "docker-compose.yaml" ]; then

              COMPOSE_FILE="docker-compose.yaml"

            else

              echo "ERROR: docker-compose.yml / docker-compose.yaml not found"

              ls -la

              exit 1

            fi

            echo "Using compose file:"
            echo "$COMPOSE_FILE"


            # ========================================
            # DOCKER CHECK
            # ========================================

            echo "================================"
            echo "DOCKER VERSION"
            echo "================================"

            docker --version
            docker compose version


            # ========================================
            # CHECK DOCKER PERMISSION
            # ========================================

            echo "================================"
            echo "DOCKER ACCESS"
            echo "================================"

            docker ps


            # ========================================
            # BUILD
            # ========================================

            echo "================================"
            echo "BUILDING APPLICATION"
            echo "================================"

            docker compose -f "$COMPOSE_FILE" build --no-cache


            # ========================================
            # START
            # ========================================

            echo "================================"
            echo "STARTING APPLICATION"
            echo "================================"

            docker compose -f "$COMPOSE_FILE" up -d


            # ========================================
            # WAIT FOR CONTAINER
            # ========================================

            echo "================================"
            echo "WAITING FOR CONTAINER"
            echo "================================"

            sleep 10


            # ========================================
            # CONTAINER STATUS
            # ========================================

            echo "================================"
            echo "CONTAINER STATUS"
            echo "================================"

            docker compose -f "$COMPOSE_FILE" ps


            # ========================================
            # DOCKER PS
            # ========================================

            echo "================================"
            echo "DOCKER PS"
            echo "================================"

            docker ps


            # ========================================
            # PORT 5555
            # ========================================

            echo "================================"
            echo "PORT 5555"
            echo "================================"

            ss -lntp | grep 5555 || true


            # ========================================
            # HEALTH CHECK
            # ========================================

            echo "================================"
            echo "HEALTH CHECK"
            echo "================================"

            CONTAINER_ID=$(docker compose -f "$COMPOSE_FILE" ps -q)

            if [ -n "$CONTAINER_ID" ]; then

              docker inspect \
                --format='{{.State.Status}}' \
                "$CONTAINER_ID" || true

              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID" || true

            fi


            # ========================================
            # LOGS
            # ========================================

            echo "================================"
            echo "APPLICATION LOGS"
            echo "================================"

            docker compose -f "$COMPOSE_FILE" logs --tail=50 || true


            echo "================================"
            echo "DEPLOYMENT COMPLETED"
            echo "================================"
