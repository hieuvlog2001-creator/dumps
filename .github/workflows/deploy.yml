name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================

      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "========================================"
            echo "SSH CONNECTION SUCCESS"
            echo "========================================"

            whoami
            id
            hostname

            echo "========================================"
            echo "CHECKING APP DIRECTORY"
            echo "========================================"

            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR"
              mkdir -p "$APP_DIR"
            fi

            cd "$APP_DIR"

            echo "Application directory:"
            ls -ld "$APP_DIR"

            echo "========================================"
            echo "CHECKING DOCKER"
            echo "========================================"

            docker --version
            docker compose version
            docker ps

            echo "========================================"
            echo "STOPPING OLD CONTAINER"
            echo "========================================"

            if [ -f "docker-compose.yml" ]; then

              docker compose down --remove-orphans || true

            elif [ -f "docker-compose.yaml" ]; then

              docker compose down --remove-orphans || true

            fi

            echo "========================================"
            echo "REMOVING OLD APPLICATION FILES"
            echo "========================================"

            # Không xóa uploads và logs
            # vì đây là persistent data.

            find "$APP_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name "uploads" \
              ! -name "logs" \
              -exec rm -rf {} +

            echo "Old application files removed."

            echo "========================================"
            echo "PREPARING PERSISTENT DIRECTORIES"
            echo "========================================"

            mkdir -p "$APP_DIR/uploads"
            mkdir -p "$APP_DIR/logs"

            chmod 755 "$APP_DIR/uploads" || true
            chmod 755 "$APP_DIR/logs" || true

            ls -la "$APP_DIR"


      # ========================================
      # 3. COPY PROJECT
      # ========================================

      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          timeout: 60s
          command_timeout: 10m

          rm: false
          overwrite: true


      # ========================================
      # 4. BUILD + RUN
      # ========================================

      - name: Build and run application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"

            echo "========================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "========================================"

            pwd
            ls -la


            # ========================================
            # REQUIRED FILES
            # ========================================

            echo "========================================"
            echo "CHECKING REQUIRED FILES"
            echo "========================================"

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            if [ ! -f "Dockerfile" ]; then
              echo "ERROR: Dockerfile not found"
              exit 1
            fi


            # ========================================
            # COMPOSE FILE
            # ========================================

            if [ -f "docker-compose.yml" ]; then

              COMPOSE_FILE="docker-compose.yml"

            elif [ -f "docker-compose.yaml" ]; then

              COMPOSE_FILE="docker-compose.yaml"

            else

              echo "ERROR: docker-compose file not found"
              exit 1

            fi

            echo "Using:"
            echo "$COMPOSE_FILE"


            # ========================================
            # DOCKER
            # ========================================

            echo "========================================"
            echo "DOCKER VERSION"
            echo "========================================"

            docker --version
            docker compose version

            echo "========================================"
            echo "DOCKER ACCESS"
            echo "========================================"

            docker ps


            # ========================================
            # ENSURE DIRECTORIES
            # ========================================

            mkdir -p uploads
            mkdir -p logs


            # ========================================
            # BUILD
            # ========================================

            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" build --no-cache


            # ========================================
            # START
            # ========================================

            echo "========================================"
            echo "STARTING APPLICATION"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" up -d


            # ========================================
            # WAIT
            # ========================================

            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            sleep 10


            # ========================================
            # CONTAINER STATUS
            # ========================================

            echo "========================================"
            echo "CONTAINER STATUS"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" ps


            # ========================================
            # DOCKER PS
            # ========================================

            echo "========================================"
            echo "DOCKER PS"
            echo "========================================"

            docker ps


            # ========================================
            # PORT 5555
            # ========================================

            echo "========================================"
            echo "PORT 5555"
            echo "========================================"

            ss -lntp | grep 5555 || true


            # ========================================
            # LOCAL HEALTH CHECK
            # ========================================

            echo "========================================"
            echo "LOCAL HEALTH CHECK"
            echo "========================================"

            if curl -fsS --max-time 10 \
              http://127.0.0.1:5555/api/health; then

              echo
              echo "LOCAL HEALTH CHECK: OK"

            else

              echo
              echo "LOCAL HEALTH CHECK FAILED"

              docker compose -f "$COMPOSE_FILE" logs --tail=100

              exit 1

            fi


            # ========================================
            # ROOT HTTP CHECK
            # ========================================

            echo "========================================"
            echo "ROOT HTTP CHECK"
            echo "========================================"

            curl -I --max-time 10 \
              http://127.0.0.1:5555/ || true


            # ========================================
            # CONTAINER HEALTH
            # ========================================

            echo "========================================"
            echo "CONTAINER HEALTH"
            echo "========================================"

            CONTAINER_ID=$(docker compose \
              -f "$COMPOSE_FILE" \
              ps -q il2cpp-dumper)

            if [ -n "$CONTAINER_ID" ]; then

              docker inspect \
                --format='STATUS={{.State.Status}}' \
                "$CONTAINER_ID" || true

              docker inspect \
                --format='HEALTH={{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID" || true

            fi


            # ========================================
            # LOGS
            # ========================================

            echo "========================================"
            echo "APPLICATION LOGS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              logs --tail=50 || true


            echo "========================================"
            echo "DEPLOYMENT COMPLETED"
            echo "========================================"

            echo "Application:"
            echo "http://127.0.0.1:5555/"

            echo "Port:"
            echo "5555"

            echo "========================================"
