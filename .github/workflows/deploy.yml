name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "========================================"
            echo "SSH CONNECTION SUCCESS"
            echo "========================================"

            whoami
            id
            hostname

            echo "========================================"
            echo "CHECKING APP DIRECTORY"
            echo "========================================"

            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR"
              sudo mkdir -p "$APP_DIR"
            fi

            echo "Application directory:"
            ls -ld "$APP_DIR"

            echo "========================================"
            echo "CHECKING DOCKER"
            echo "========================================"

            docker --version
            docker compose version
            docker ps

            echo "========================================"
            echo "STOPPING OLD CONTAINER"
            echo "========================================"

            cd "$APP_DIR"

            if [ -f "docker-compose.yml" ]; then
              docker compose -f docker-compose.yml down --remove-orphans || true
            elif [ -f "docker-compose.yaml" ]; then
              docker compose -f docker-compose.yaml down --remove-orphans || true
            fi

            echo "========================================"
            echo "FIXING FILE PERMISSIONS"
            echo "========================================"

            # Docker có thể đã tạo uploads/logs bằng root.
            # Chuyển quyền về user deploy trước khi xoá.
            if [ -d "$APP_DIR/uploads" ]; then
              sudo chown -R "$(whoami):$(id -gn)" "$APP_DIR/uploads" || true
            fi

            if [ -d "$APP_DIR/logs" ]; then
              sudo chown -R "$(whoami):$(id -gn)" "$APP_DIR/logs" || true
            fi

            echo "========================================"
            echo "CLEANING OLD DEPLOYMENT"
            echo "========================================"

            # Không xoá .env.
            # .env thường không nằm trong GitHub repository.
            #
            # Xoá tất cả file/thư mục khác.
            find "$APP_DIR" \
              -mindepth 1 \
              -maxdepth 1 \
              ! -name ".env" \
              -exec rm -rf {} +

            echo "Old deployment files removed."

            echo "========================================"
            echo "CHECKING ENV"
            echo "========================================"

            if [ -f "$APP_DIR/.env" ]; then
              echo ".env EXISTS"
            else
              echo "WARNING: .env NOT FOUND"
              echo "The application may fail if environment variables are required."
            fi

            echo "========================================"
            echo "DIRECTORY READY"
            echo "========================================"

            ls -la "$APP_DIR"


      # ========================================
      # 3. COPY PROJECT
      # ========================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "*"

          target: "/opt/il2cpp-dumper-server"

          timeout: 60s
          command_timeout: 10m

          overwrite: true
          rm: false


      # ========================================
      # 4. BUILD + RUN
      # ========================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"

            echo "========================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "========================================"

            pwd
            ls -la

            echo "========================================"
            echo "CHECKING REQUIRED FILES"
            echo "========================================"

            if [ ! -f "package.json" ]; then
              echo "ERROR: package.json not found"
              exit 1
            fi

            if [ ! -f "Dockerfile" ]; then
              echo "ERROR: Dockerfile not found"
              exit 1
            fi

            echo "package.json: OK"
            echo "Dockerfile: OK"

            echo "========================================"
            echo "CHECKING ENV"
            echo "========================================"

            if [ -f ".env" ]; then
              echo ".env: OK"
            else
              echo "WARNING: .env NOT FOUND"
            fi

            echo "========================================"
            echo "FINDING COMPOSE FILE"
            echo "========================================"

            if [ -f "docker-compose.yml" ]; then
              COMPOSE_FILE="docker-compose.yml"
            elif [ -f "docker-compose.yaml" ]; then
              COMPOSE_FILE="docker-compose.yaml"
            else
              echo "ERROR: docker-compose.yml not found"
              exit 1
            fi

            echo "Using:"
            echo "$COMPOSE_FILE"

            echo "========================================"
            echo "DOCKER VERSION"
            echo "========================================"

            docker --version
            docker compose version

            echo "========================================"
            echo "DOCKER ACCESS"
            echo "========================================"

            docker ps

            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" build --no-cache

            echo "========================================"
            echo "STARTING APPLICATION"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" up -d --force-recreate

            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            sleep 10

            echo "========================================"
            echo "CONTAINER STATUS"
            echo "========================================"

            docker compose -f "$COMPOSE_FILE" ps

            echo "========================================"
            echo "DOCKER PS"
            echo "========================================"

            docker ps

            echo "========================================"
            echo "PORT 5555"
            echo "========================================"

            ss -lntp | grep 5555 || true

            echo "========================================"
            echo "LOCAL HEALTH CHECK"
            echo "========================================"

            if curl -fsS --max-time 10 \
              http://127.0.0.1:5555/api/health; then

              echo ""
              echo "HEALTH CHECK: OK"

            else

              echo ""
              echo "HEALTH CHECK FAILED"

              docker compose \
                -f "$COMPOSE_FILE" \
                logs --tail=100

              exit 1

            fi

            echo "========================================"
            echo "CONTAINER HEALTH"
            echo "========================================"

            CONTAINER_ID=$(docker compose \
              -f "$COMPOSE_FILE" \
              ps -q il2cpp-dumper || true)

            if [ -n "$CONTAINER_ID" ]; then

              docker inspect \
                --format='Status: {{.State.Status}}' \
                "$CONTAINER_ID" || true

              docker inspect \
                --format='Health: {{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID" || true

            fi

            echo "========================================"
            echo "APPLICATION LOGS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              logs --tail=50 || true

            echo "========================================"
            echo "DEPLOYMENT COMPLETED"
            echo "========================================"
