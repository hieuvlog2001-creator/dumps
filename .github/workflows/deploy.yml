name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # ========================================
      # 1. CHECKOUT
      # ========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================
      # 2. PREPARE VPS
      # ========================================
      - name: Prepare VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 10m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            echo "========================================"
            echo "SSH CONNECTION SUCCESS"
            echo "========================================"

            echo "User:"
            whoami

            echo "UID:"
            id

            echo "Hostname:"
            hostname


            # ========================================
            # CREATE APP DIRECTORY
            # ========================================

            echo "========================================"
            echo "CHECKING APPLICATION DIRECTORY"
            echo "========================================"

            if [ ! -d "$APP_DIR" ]; then
              echo "Creating $APP_DIR"

              mkdir -p "$APP_DIR"
            fi

            echo "Application directory:"
            ls -ld "$APP_DIR"


            # ========================================
            # DOCKER CHECK
            # ========================================

            echo "========================================"
            echo "CHECKING DOCKER"
            echo "========================================"

            docker --version
            docker compose version

            echo "Docker permission:"
            docker ps


            # ========================================
            # STOP OLD CONTAINER
            # ========================================

            echo "========================================"
            echo "STOPPING OLD CONTAINER"
            echo "========================================"

            cd "$APP_DIR"

            if [ -f "docker-compose.yml" ]; then

              echo "Found docker-compose.yml"

              docker compose -f docker-compose.yml down \
                --remove-orphans || true

            elif [ -f "docker-compose.yaml" ]; then

              echo "Found docker-compose.yaml"

              docker compose -f docker-compose.yaml down \
                --remove-orphans || true

            else

              echo "No existing compose file."
              echo "Nothing to stop."

            fi


            # ========================================
            # FIX ROOT-OWNED FILES
            # ========================================

            echo "========================================"
            echo "CLEANING ROOT-OWNED DEPLOYMENT FILES"
            echo "========================================"

            if [ -d "$APP_DIR" ]; then

              echo "Using Docker to remove root-owned files."

              docker run --rm \
                -v "$APP_DIR:/cleanup" \
                alpine:latest \
                sh -c '
                  find /cleanup \
                    -mindepth 1 \
                    -maxdepth 1 \
                    ! -name uploads \
                    -exec rm -rf -- {} +
                '

            fi

            echo "Old application files removed."

            echo "Current directory:"
            ls -la "$APP_DIR"


            # ========================================
            # FIX DIRECTORY OWNERSHIP
            # ========================================

            echo "========================================"
            echo "FIXING DIRECTORY OWNERSHIP"
            echo "========================================"

            # Chown bằng Docker vì user SSH không có sudo password.
            docker run --rm \
              -v "$APP_DIR:/cleanup" \
              alpine:latest \
              sh -c '
                chown -R 1000:1000 /cleanup
              '


            echo "Ownership after cleanup:"
            ls -ld "$APP_DIR"

            if [ -d "$APP_DIR/uploads" ]; then
              ls -ld "$APP_DIR/uploads"
            fi

            echo "========================================"
            echo "VPS PREPARATION COMPLETED"
            echo "========================================"


      # ========================================
      # 3. COPY PROJECT
      # ========================================
      - name: Copy files to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          source: "."

          target: "/opt/il2cpp-dumper-server"

          timeout: 60s
          command_timeout: 10m

          rm: false
          overwrite: true


      # ========================================
      # 4. BUILD + RUN
      # ========================================
      - name: Build and run application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_SSH_PORT }}

          timeout: 30s
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/opt/il2cpp-dumper-server"

            cd "$APP_DIR"


            # ========================================
            # DEPLOYMENT DIRECTORY
            # ========================================

            echo "========================================"
            echo "DEPLOYMENT DIRECTORY"
            echo "========================================"

            pwd
            ls -la


            # ========================================
            # CHECK PACKAGE.JSON
            # ========================================

            echo "========================================"
            echo "CHECKING REQUIRED FILES"
            echo "========================================"

            if [ ! -f "package.json" ]; then

              echo "ERROR: package.json not found"

              echo "Files:"
              ls -la

              exit 1

            fi

            echo "package.json OK"


            # ========================================
            # FIND COMPOSE FILE
            # ========================================

            echo "========================================"
            echo "CHECKING DOCKER COMPOSE"
            echo "========================================"

            if [ -f "docker-compose.yml" ]; then

              COMPOSE_FILE="docker-compose.yml"

            elif [ -f "docker-compose.yaml" ]; then

              COMPOSE_FILE="docker-compose.yaml"

            else

              echo "ERROR: docker-compose.yml not found"

              ls -la

              exit 1

            fi

            echo "Using:"
            echo "$COMPOSE_FILE"


            # ========================================
            # DOCKER CHECK
            # ========================================

            echo "========================================"
            echo "DOCKER VERSION"
            echo "========================================"

            docker --version
            docker compose version


            # ========================================
            # DOCKER ACCESS
            # ========================================

            echo "========================================"
            echo "DOCKER ACCESS"
            echo "========================================"

            docker ps


            # ========================================
            # REMOVE OLD BUILD
            # ========================================

            echo "========================================"
            echo "REMOVING OLD BUILD"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              down \
              --remove-orphans || true


            # ========================================
            # BUILD
            # ========================================

            echo "========================================"
            echo "BUILDING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              build \
              --no-cache


            # ========================================
            # START
            # ========================================

            echo "========================================"
            echo "STARTING APPLICATION"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              up -d


            # ========================================
            # WAIT
            # ========================================

            echo "========================================"
            echo "WAITING FOR APPLICATION"
            echo "========================================"

            sleep 10


            # ========================================
            # CONTAINER STATUS
            # ========================================

            echo "========================================"
            echo "CONTAINER STATUS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              ps


            # ========================================
            # DOCKER PS
            # ========================================

            echo "========================================"
            echo "DOCKER PS"
            echo "========================================"

            docker ps


            # ========================================
            # PORT 5555
            # ========================================

            echo "========================================"
            echo "PORT 5555"
            echo "========================================"

            ss -lntp | grep 5555 || true


            # ========================================
            # LOCAL HTTP TEST
            # ========================================

            echo "========================================"
            echo "LOCAL HTTP TEST"
            echo "========================================"

            if curl -fsS \
              --max-time 15 \
              http://127.0.0.1:5555/ \
              > /tmp/il2cpp-health.html; then

              echo "HTTP TEST: SUCCESS"

              head -c 500 /tmp/il2cpp-health.html || true

              echo

            else

              echo "HTTP TEST: FAILED"

              echo "Container logs:"
              
              docker compose \
                -f "$COMPOSE_FILE" \
                logs \
                --tail=100 || true

            fi


            # ========================================
            # CONTAINER HEALTH
            # ========================================

            echo "========================================"
            echo "CONTAINER HEALTH"
            echo "========================================"

            CONTAINER_ID=$(
              docker compose \
                -f "$COMPOSE_FILE" \
                ps -q
            )

            if [ -n "$CONTAINER_ID" ]; then

              echo "Container ID:"
              echo "$CONTAINER_ID"

              echo "Container state:"

              docker inspect \
                --format='{{.State.Status}}' \
                "$CONTAINER_ID" || true

              echo "Health:"

              docker inspect \
                --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' \
                "$CONTAINER_ID" || true

            else

              echo "ERROR: Container was not created."

            fi


            # ========================================
            # PORT CHECK
            # ========================================

            echo "========================================"
            echo "PORT CHECK"
            echo "========================================"

            ss -lntp | grep ':5555' || true


            # ========================================
            # APPLICATION LOGS
            # ========================================

            echo "========================================"
            echo "APPLICATION LOGS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              logs \
              --tail=100 || true


            # ========================================
            # FINAL STATUS
            # ========================================

            echo "========================================"
            echo "FINAL CONTAINER STATUS"
            echo "========================================"

            docker compose \
              -f "$COMPOSE_FILE" \
              ps


            echo "========================================"
            echo "DEPLOYMENT COMPLETED"
            echo "========================================"
